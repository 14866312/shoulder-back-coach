<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f4f1ea;color:#121316;font-family:"Microsoft YaHei",sans-serif}
body{padding:18px;width:760px}
h1{font-size:20px;margin:0 0 12px}
.row{margin:0 0 18px;border-bottom:2px solid #d8d2c4;padding-bottom:12px}
.row h2{font-size:15px;margin:0 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
figure{margin:0;background:#fff;border:1px solid #d8d2c4}
canvas{display:block;width:360px;height:225px}
figcaption{font-size:12px;padding:4px 7px;background:#eee8dc}
</style></head><body>
<h1>动作画布检查 · p=0.62</h1><div id="grid"></div>
<script src="../figures.js"></script>
<script>
var params = new URLSearchParams(location.search);
var ids = (params.get('ids') || Object.keys(FIGURES).join(',')).split(',');
var grid = document.getElementById('grid');
grid.innerHTML = ids.map(function (id) {
  return '<section class="row"><h2>' + FIGURES[id].name + ' · ' + id + '</h2><div class="pair">' +
    '<figure><canvas width="360" height="225" data-id="' + id + '" data-fault="0"></canvas><figcaption>正确动作</figcaption></figure>' +
    '<figure><canvas width="360" height="225" data-id="' + id + '" data-fault="1"></canvas><figcaption>错误示范</figcaption></figure></div></section>';
}).join('');
Array.prototype.forEach.call(document.querySelectorAll('canvas'), function (cv) {
  var ctx = cv.getContext('2d');
  ctx.setTransform(360 / 960, 0, 0, 225 / 600, 0, 0);
  ctx.fillStyle = '#F4F1EA'; ctx.fillRect(0, 0, 960, 600);
  FIGURES[cv.getAttribute('data-id')].draw(ctx, 960, 600, 0.62, cv.getAttribute('data-fault') === '1');
});
</script></body></html>

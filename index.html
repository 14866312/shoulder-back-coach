<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121316">
  <meta name="description" content="肩背教练：六周肩背优先训练计划、动作动画与本地训练记录。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>肩背教练</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button class="tab is-active" data-route="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8v8M8 6v12M16 6v12M19 8v8M8 12h8"/></svg>
        <span>今天</span>
      </button>
      <button class="tab" data-route="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h6"/></svg>
        <span>计划</span>
      </button>
      <button class="tab" data-route="log">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg>
        <span>记录</span>
      </button>
      <button class="tab" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <section id="trainLayer" class="layer train-layer is-hidden" aria-hidden="true" aria-label="跟练">
    <header class="train-top">
      <div class="train-progress"><strong id="trainExIndex">动作 1/1</strong><span id="trainSetIndex">第 1/2 组</span></div>
      <div class="train-clock" id="trainClock">00:00</div>
      <button class="icon-btn" id="trainEndBtn" aria-label="结束训练">结束</button>
    </header>
    <div class="train-scroll">
      <div class="canvas-wrap">
        <canvas id="trainCanvas" width="960" height="600" aria-label="动作动画"></canvas>
        <span id="faultBadge" class="fault-badge is-hidden">错误示范</span>
      </div>
      <div class="segmented" id="figureToggle">
        <button class="is-active" data-figure-mode="correct">正确动作</button>
        <button data-figure-mode="fault">错误示范</button>
      </div>
      <div class="train-heading">
        <div><p class="eyebrow" id="trainDayLabel">周一 · 上肢A</p><h1 id="trainName">高位下拉</h1></div>
        <span class="phase-pill" id="trainPhase">适应</span>
      </div>
      <div class="train-meta">
        <span id="trainTarget">3 组 × 8–12 次</span><span id="trainRest">组间 150 秒</span>
      </div>
      <p class="last-record" id="trainLast">上次：暂无记录</p>
      <p class="cue" id="trainCue"></p>
      <div class="tips" id="trainTips"></div>
      <div class="fault-chips is-hidden" id="trainFaultChips"></div>
      <details class="fold" id="trainGuide"><summary>动作教学<span class="fold-count" id="trainGuideCount">4 项</span></summary><div class="fold-body" id="trainGuideBody"></div></details>
      <label class="field setup-field"><span>器械设置 <small>可留空；同动作同设置才比较进阶</small></span><input id="setupInput" type="text" maxlength="40" placeholder="如 座椅3档 / 宽握"></label>
      <div class="set-panel">
        <div class="set-panel-head"><strong>本组记录</strong><span id="setHint">填完再点完成</span></div>
        <div class="input-grid">
          <label class="num-field"><span>重量 kg</span><input id="kgInput" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0"></label>
          <label class="num-field"><span>次数</span><input id="repsInput" type="number" inputmode="numeric" min="1" step="1" placeholder="—"></label>
          <label class="num-field"><span>RIR</span><input id="rirInput" type="number" inputmode="numeric" min="0" max="5" step="1" value="3"></label>
        </div>
        <button class="btn primary wide" id="completeSetBtn">完成本组</button>
        <button class="btn danger-ghost wide" id="painBtn">关节不适</button>
      </div>
      <p class="micro-note">RIR = 还能完成的标准次数。关节刺痛、卡痛或放射痛不是普通酸胀。</p>
    </div>
  </section>

  <section id="restLayer" class="layer rest-layer is-hidden" aria-hidden="true" aria-label="组间休息">
    <div class="rest-card">
      <p class="eyebrow">组间休息</p>
      <div class="rest-time" id="restTime">02:30</div>
      <p class="rest-next" id="restNext">下一组：高位下拉</p>
      <div class="rest-actions">
        <button class="btn ghost" id="restMinus">-15 秒</button>
        <button class="btn ghost" id="restPlus">+15 秒</button>
        <button class="btn primary" id="restSkip">跳过</button>
      </div>
      <p class="micro-note">倒计时结束会响铃并振动，自动回到记录界面。</p>
    </div>
  </section>

  <section id="summaryLayer" class="layer summary-layer is-hidden" aria-hidden="true" aria-label="训练小结">
    <header class="summary-top"><div><p class="eyebrow">训练小结</p><h1>今天完成了</h1></div><button class="icon-btn" id="summaryCloseBtn" aria-label="返回">关闭</button></header>
    <div class="summary-scroll" id="summaryBody"></div>
    <footer class="summary-footer"><button class="btn primary wide" id="saveSummaryBtn">保存并结束</button></footer>
  </section>

  <div id="modalLayer" class="modal-layer is-hidden" aria-hidden="true">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast is-hidden" role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script src="./plan.js"></script>
  <script src="./guides.js"></script>
  <script src="./figures.js"></script>
  <script src="./app.js"></script>
</body>
</html>
